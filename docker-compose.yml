services:
  jenkins:
    build:
      context: ./jenkins
    image: campus-tester-jenkins:lts
    container_name: campus-tester-jenkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DEFAULT_TARGET_URL: ${TARGET_URL:-}
      JENKINS_ADMIN_USERNAME: ${JENKINS_ADMIN_USERNAME:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
      JENKINSFILE_REPOSITORY: ${JENKINSFILE_REPOSITORY:-https://github.com/eldar-safin/campus-tester.git}
      JENKINSFILE_BRANCH: ${JENKINSFILE_BRANCH:-main}
      JENKINSFILE_PATH: ${JENKINSFILE_PATH:-Jenkinsfile}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles:
      - tests
    init: true
    ipc: host
    working_dir: /work
    environment:
      TARGET_URL: ${TARGET_URL:-}
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ./playwright:/work
      - playwright_node_modules:/work/node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund > /dev/null && npm test"]

volumes:
  jenkins_home:
  playwright_node_modules:
