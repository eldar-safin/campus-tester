services:
  jenkins:
    build:
      context: ./jenkins
    image: campus-tester-jenkins:lts
    container_name: campus-tester-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  jenkins_home:
