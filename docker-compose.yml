services:
  jenkins:
    build:
      context: ./jenkins
    image: campus-tester-jenkins:lts
    container_name: campus-tester-jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    profiles:
      - tests
    init: true
    ipc: host
    working_dir: /work
    environment:
      TARGET_URL: ${TARGET_URL:?Переменная TARGET_URL не задана. Укажите её в файле .env}
    volumes:
      - ./playwright:/work
      - playwright_node_modules:/work/node_modules
    command: ["sh", "-c", "npm ci && npm test"]

volumes:
  jenkins_home:
  playwright_node_modules:
